name: Android Release

on:
  push:
    tags:
      - "v*"
      - "release-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        shell: pwsh
        run: |
          cmd /c "echo y| sdkmanager --licenses >nul"

      - name: Install SDK packages
        shell: pwsh
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Build Debug APK
        shell: pwsh
        run: |
          .\gradlew.bat assembleDebug --no-daemon --stacktrace --console plain

      - name: Prepare release assets
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $apkDir = "release-assets"
          New-Item -ItemType Directory -Path $apkDir -Force | Out-Null
          Copy-Item "app\build\outputs\apk\debug\app-debug.apk" "$apkDir\MetaAgent-$tag-debug.apk" -Force
          $hash = (Get-FileHash "$apkDir\MetaAgent-$tag-debug.apk" -Algorithm SHA256).Hash
          Set-Content -Path "$apkDir\SHA256.txt" -Value "MetaAgent-$tag-debug.apk  $hash"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MetaAgent-${{ github.ref_name }}-release-assets
          path: release-assets/*

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/MetaAgent-${{ github.ref_name }}-debug.apk
            release-assets/SHA256.txt
